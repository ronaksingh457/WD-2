<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1 id="heading">Welcome to JavaScript Lab</h1>

        <input type="text" id="userInput" placeholder="Enter new heading text">

        <button id="changeTextBtn">Change Heading</button>
        <button id="bgColorBtn">Change Background</button>
        <button id="fontSizeBtn">Increase Font size</button>
        <button id="toggleBtn">ShowHide Paragraph</button>
        <button id="resetBtn">Reset</button>

        <p id="paragraph">
            This is a sample paragraph. JavaScript events can dynamically change content.
        </p>
    </div>

    <script src="script.js"></script>

</body>
</html>
